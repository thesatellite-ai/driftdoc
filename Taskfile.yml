version: '3'

# driftdoc developer tasks. `task --list` to see them all.

vars:
  VERSION: '{{.VERSION | default "0.1.0-dev"}}'

tasks:
  build:
    desc: Build the driftdoc binary into ./bin
    cmds:
      - go build -trimpath -ldflags='-s -w -X main.version={{.VERSION}}' -o bin/driftdoc ./cmd/driftdoc

  install:
    desc: Install driftdoc onto $GOBIN/$GOPATH/bin
    cmds:
      - go install -trimpath -ldflags='-s -w -X main.version={{.VERSION}}' ./cmd/driftdoc

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: gofmt check + go vet
    cmds:
      - test -z "$(gofmt -l .)" || (echo 'gofmt needed:'; gofmt -l .; exit 1)
      - go vet ./...

  names:
    desc: Check tracked files for private names (needs the local word list; skips without it)
    cmds:
      - ./scripts/check-names.sh --all

  check:
    desc: Dogfood — run driftdoc against this repo's own drift.yaml
    cmds:
      - go run ./cmd/driftdoc check

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy
